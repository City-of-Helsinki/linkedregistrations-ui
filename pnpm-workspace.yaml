# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Don't warn about ignored build scripts
ignoredBuiltDependencies: []

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

overrides:
  '@typescript-eslint/typescript-estree>minimatch': '>=9.0.7'
  'brace-expansion': '>=5.0.9'
  'browserslist': '>=4.28.7'
  'fast-uri': '>=3.1.5'
  'hds-react>cookie': '>=0.7.0'
  'immutable': '>=5.1.8'
  'js-yaml': '>=4.3.1'
  'nanoid': '>=3.3.18 <4.0.0'
  'postcss': '>=8.5.18'
  'source-map-js': '>=1.2.2'
  'sharp': '>=0.35.0'
  'undici': '>=7.29.0'
  'uuid': '>=11.1.1'
  '@opentelemetry/core@^2': '^2.8.0'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js: false
  msw: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
